name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG and app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build macOS app and DMG
        # Call explicitly through bash so the build works even if ZIP/Git file mode
        # metadata does not preserve the executable bit for this script.
        shell: bash
        run: bash ./packaging/scripts/build-macos.sh
      - name: Upload Maven test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RailSafe-JX-macOS-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: RailSafe-JX-macOS
          path: dist/macos/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows EXE and portable app
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install WiX Toolset for jpackage
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3.*\bin' -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $wix) { throw 'Could not find WiX Toolset v3 bin directory after installation.' }
          Add-Content -Path $env:GITHUB_PATH -Value $wix
      - name: Build Windows app and installer
        shell: pwsh
        run: .\packaging\scripts\build-windows.ps1
      - name: Upload Maven test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RailSafe-JX-Windows-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: RailSafe-JX-Windows
          path: dist/windows/
          if-no-files-found: error
          retention-days: 14
